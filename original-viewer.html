<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Original document — Aman</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="originals.css" />
    <style>
      .document-shell{width:min(1052px,calc(100% - 56px));margin:0 auto;padding:70px 0}.document-shell h1{font:700 clamp(42px,7vw,82px)/.95 'Playfair Display',serif;letter-spacing:-.05em;margin:22px 0 14px;max-width:800px}.document-copy{color:var(--muted);max-width:620px}.document-actions{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}.document-frame{height:72vh;min-height:480px;width:100%;border:1px solid var(--line);border-radius:16px;background:#fffaf2}.document-frame iframe{width:100%;height:100%;border:0;border-radius:16px}.download-link{background:var(--orange);color:#fff}.document-footer{padding:24px 0;font-size:12px;color:var(--muted)}@media(max-width:600px){.document-shell{width:calc(100% - 32px);padding-top:45px}.document-frame{min-height:560px}.document-actions{flex-direction:column;align-items:flex-start}}
    </style>
  </head>
  <body>
    <header class="site-header shell"><a class="wordmark" href="index.html">Aman</a><a class="pill pill-dark" href="index.html">Back to work <span aria-hidden="true">↗</span></a></header>
    <main class="document-shell">
      <div class="eyebrow">Original document</div>
      <h1 id="document-title">Your original case-study file</h1>
      <p class="document-copy">If the embedded preview does not render in this browser, use the buttons below to open the PDF in a new browser tab or download it directly.</p>
      <div class="document-actions"><a class="pill pill-dark" id="open-pdf" target="_blank" rel="noopener">Open PDF in new tab <span aria-hidden="true">↗</span></a><a class="pill download-link" id="download-pdf" download>Download PDF <span aria-hidden="true">↓</span></a></div>
      <div class="document-frame"><iframe id="pdf-frame" title="Original PDF document"></iframe></div>
      <p class="document-footer"><a href="index.html">Return to Aman’s portfolio</a></p>
    </main>
    <script>
      const file = new URLSearchParams(window.location.search).get('file');
      const decodedFile = file ? decodeURIComponent(file) : '';
      const fileName = decodedFile.split('/').pop() || 'original document';
      document.title = `${fileName} — Aman`;
      document.querySelector('#document-title').textContent = fileName;
      document.querySelector('#open-pdf').href = decodedFile;
      document.querySelector('#download-pdf').href = decodedFile;
      document.querySelector('#pdf-frame').src = decodedFile;
    </script>
  </body>
</html>
