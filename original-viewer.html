<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Original artifact — Aman & Anushka</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="originals.css" />
    <style>
      .document-shell{width:min(1052px,calc(100% - 56px));margin:0 auto;padding:70px 0}.document-shell h1{font:700 clamp(36px,6vw,72px)/.95 'Playfair Display',serif;letter-spacing:-.05em;margin:22px 0 14px;max-width:850px}.document-copy{color:var(--muted);max-width:640px}.document-actions{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}.document-frame{min-height:520px;width:100%;border:1px solid var(--line);border-radius:16px;background:#fffaf2;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:12px}.document-frame iframe{width:100%;height:75vh;min-height:500px;border:0;border-radius:12px}.document-frame img{max-width:100%;height:auto;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);object-fit:contain}.download-link{background:var(--orange);color:#fff}.document-footer{padding:24px 0;font-size:13px;color:var(--muted)}@media(max-width:600px){.document-shell{width:calc(100% - 32px);padding-top:45px}.document-frame{min-height:420px}.document-actions{flex-direction:column;align-items:flex-start}}
    </style>
  </head>
  <body>
    <header class="site-header shell"><a class="wordmark" href="index.html">Aman & Anushka</a><a class="pill pill-dark" href="index.html">Back to portfolio <span aria-hidden="true">↗</span></a></header>
    <main class="document-shell">
      <div class="eyebrow">Original Artifact Document</div>
      <h1 id="document-title">Original Artifact File</h1>
      <p class="document-copy" id="document-desc">Use the buttons below to open the artifact file in a new browser tab or download it directly to your device.</p>
      <div class="document-actions"><a class="pill pill-dark" id="open-pdf" target="_blank" rel="noopener">Open file in new tab <span aria-hidden="true">↗</span></a><a class="pill download-link" id="download-pdf" download>Download artifact <span aria-hidden="true">↓</span></a></div>
      <div class="document-frame" id="frame-container"><iframe id="pdf-frame" title="Original document"></iframe><img id="img-frame" style="display:none;" alt="Original image artifact" /></div>
      <p class="document-footer"><a href="index.html">← Return to Aman & Anushka’s Digital Ethics Portfolio</a></p>
    </main>
    <script>
      const file = new URLSearchParams(window.location.search).get('file');
      const decodedFile = file ? decodeURIComponent(file) : '';
      const fileName = decodedFile.split('/').pop() || 'original document';
      const isImage = decodedFile.match(/\.(png|jpe?g|webp|gif)$/i);

      document.title = `${fileName} — Aman & Anushka`;
      document.querySelector('#document-title').textContent = fileName;
      document.querySelector('#open-pdf').href = decodedFile;
      document.querySelector('#download-pdf').href = decodedFile;

      if (isImage) {
        document.querySelector('#pdf-frame').style.display = 'none';
        const img = document.querySelector('#img-frame');
        img.src = decodedFile;
        img.style.display = 'block';
        document.querySelector('#document-desc').textContent = 'Viewing high-resolution image artifact. Click below to open in full size or download.';
      } else {
        document.querySelector('#img-frame').style.display = 'none';
        document.querySelector('#pdf-frame').src = decodedFile;
      }
    </script>
  </body>
</html>
